<button mat-raised-button class="fancy-button" color="primary" (click)="openAddWorkout()">
  <mat-icon>add</mat-icon> New Workout
</button>

<h3>My Workouts</h3>
<div class="workout-list-container">
  <div class="workout-grid">
    <app-workout-card
      *ngFor="let workout of workouts"
      [workout]="workout"
    ></app-workout-card>
  </div>
</div>
