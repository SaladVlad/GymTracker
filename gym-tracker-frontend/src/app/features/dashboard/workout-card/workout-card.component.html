<mat-card class="workout-card" [ngClass]="getCardClass()">
  <div class="workout-header">
    <div class="workout-type">{{ workout.type }}</div>
    <div class="workout-date">
      {{ workout.performedAt | date: 'MMM d, y, HH:mm' }}
    </div>
  </div>
  <div class="workout-details">
    <p>⏱ Duration: {{ workout.durationMinutes }} min</p>
    <p>🔥 Intensity: {{ workout.intensity }} / 10</p>
    <p>😩 Fatigue: {{ workout.fatigue }} / 10</p>
    <p>🍽 Calories: {{ workout.caloriesBurned }}</p>
    <p *ngIf="workout.notes"><i>📝 Notes: {{ workout.notes }}</i></p>
  </div>
</mat-card>
