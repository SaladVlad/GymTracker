<mat-card class="progress-card">
  <h2>Monthly Progress</h2>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Year</mat-label>
      <input matInput type="number" [(ngModel)]="selectedYear" (ngModelChange)="onSelectionChange()" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Month</mat-label>
      <mat-select [(ngModel)]="selectedMonth" (selectionChange)="onSelectionChange()">
        <mat-option *ngFor="let m of months" [value]="m.value">{{ m.label }}</mat-option>
      </mat-select>
    </mat-form-field>

  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  <p *ngIf="error" class="error-text">{{ error }}</p>

  <div class="progress-grid">
    <mat-card
      *ngFor="let w of progressData"
      class="week-card"
      [ngStyle]="{ 'background': getIntensityGradient(w.avgIntensity) }"
    >
      <h3>Week {{ w.weekIndex + 1 }}</h3>
      <p><strong>{{ w.startDate | date:'MMM d' }} → {{ w.endDate | date:'MMM d' }}</strong></p>

      <p>🕒 <strong>{{ w.totalDuration }} min</strong> total</p>
      <p>🏋️ <strong>{{ w.workoutCount }}</strong> workouts</p>
      <p>🔥 Intensity: <strong>{{ w.avgIntensity }}</strong></p>
      <p>😮‍💨 Fatigue: <strong>{{ w.avgFatigue }}</strong></p>
    </mat-card>
  </div>

</mat-card>
